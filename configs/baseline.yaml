# Experiment configuration for learned image compression

lambdas: [0.0018, 0.0035, 0.0067, 0.013]
qualities: [1, 2, 3, 4]

paths:
  clic_train_dir: datasets/clic_images/train
  clic_val_dir: datasets/clic_images/validation
  kodak_dir: datasets/kodak
  checkpoint_dir: checkpoints
  results_dir: experiments/results
  plots_dir: experiments/plots
  recon_dir: experiments/reconstructions

training:
  epochs: 100
  batch_size: 32
  patch_size: 256
  lr: 1.0e-4
  se_lr: 1.0e-3
  num_workers: 4
  seed: 42
  distortion: mse
  freeze_mode: none
  early_stop_patience: 20
  deterministic: true
  pin_memory: true
  drop_last: true

scheduler:
  factor: 0.1
  patience: 10

evaluation:
  compute_coded_bpp: true
  save_reconstructions: true
  reconstruction_limit: 4
  reconstruction_indices: [0, 1, 2, 3]

pipeline:
  trained_variants: [A_ft, B, C]
  freeze_modes: [none, frozen_hyperprior, attention_only]
  attention_only_variants: [B, C]
  reference_variants:
    - A
    - bmshj2018_factorized
    - mbt2018_mean
    - mbt2018
    - cheng2020_anchor
